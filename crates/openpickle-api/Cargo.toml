[package]
name = "openpickle-api"
description = "Client for the Pickle character API"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
