name: Release builds

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".cargo/config.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "crates/openpickle-desktop/macos/**"
      - "crates/openpickle-desktop/windows/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and create a draft release for
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86-64
    runs-on: windows-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install the Windows Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc
      - name: Cache Rust build files
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: release-windows
      - name: Build and package OpenPickle
        shell: pwsh
        run: ./crates/openpickle-desktop/windows/package.ps1
      - name: Start the packaged program once
        shell: pwsh
        run: ./crates/openpickle-desktop/windows/smoke.ps1
      - name: Upload the Windows zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openpickle-windows-x86-64
          path: target/windows/*.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS arm64 and x86-64
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - name: Check out the release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install both macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Cache Rust build files
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: release-macos
      - name: Build and package Apple Silicon
        run: ./crates/openpickle-desktop/macos/package.sh aarch64-apple-darwin
      - name: Build and package Intel
        run: ./crates/openpickle-desktop/macos/package.sh x86_64-apple-darwin
      - name: Upload both macOS disk images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openpickle-macos
          path: target/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    if: github.event_name != 'pull_request'
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
      - name: Create the draft release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          body: |
            ## Install

            - **Apple Silicon Mac:** download the `arm64.dmg` file.
            - **Intel Mac:** download the `x86_64.dmg` file.
            - **Windows 10/11 x86-64:** download and extract the `windows-x86_64.zip` file.

            The macOS app is ad hoc signed and is not notarized. On first launch,
            Control-click it in Finder, choose **Open**, then confirm **Open**. If it is
            still blocked, use **System Settings > Privacy & Security > Open Anyway**.

            The Windows app is not code-signed. If SmartScreen blocks it, choose
            **More info > Run anyway** after verifying that you trust this download.
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
          fail_on_unmatched_files: true
